name: Validate release candidate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up verified Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          check-latest: false

      - name: Validate static release and setup contract
        run: python scripts/validate_release.py --root .
